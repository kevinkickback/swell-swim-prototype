<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamline · Swell Swim Admin</title>
  <link rel="stylesheet" href="./dashboard.css">
  <script type="module" src="./dashboard.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to workspace</a>
  <aside class="rail">
    <a class="brand" href="#overview"><span class="mark" aria-hidden="true">≈</span><span>Swell Swim<small>Swim school admin</small></span></a>
    <nav aria-label="Dashboard sections"></nav>
    <a class="back" href="../../#admin">← Prototype library</a>

      <div class="page-head">
        <div><h1 id="page-title">Streamline</h1><p id="page-description"></p></div>
        <label id="period-control" class="select-wrap"><span class="sr-only">Reporting period</span><span data-icon="calendar"></span><select id="period"><option value="7">Last 7 days</option><option value="14">Last 14 days</option></select></label>
      </div>
      <div id="view"></div>
      <noscript>Enable JavaScript to explore the sample dashboard.</noscript>
    </main>
  </div>
